name: workspace publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      # Installs deno and rust from mise.toml.
      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Format & Lint
        run: mise run check

      - name: Build
        run: mise run build:wasm:check

      - name: Test
        run: mise run test

      - name: Publish to JSR
        run: deno publish

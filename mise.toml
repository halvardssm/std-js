[tools]
deno = "latest"
rust = { version = "latest", components = ["rustfmt"], targets = [
  "wasm32-unknown-unknown",
] }

[settings]
jobs = 1

[tasks.check]
description = "Format check, lint, and type-check"
depends = ["format:check", "lint"]
run = "deno check **/*.ts"

[tasks."check:pre-commit"]
description = "Fast checks to run before a commit: format check, lint, and type-check"
depends = ["check", "build:wasm:check", "test", "publish:dry:dirty"]

[tasks."check:pre-push"]
description = "Full checks to run before a push: pre-commit checks, wasm parity, and tests"
depends = ["check:pre-commit", "build:wasm:check", "test", "publish:dry"]

[tasks.lint]
description = "Lint the TypeScript code"
run = "deno lint"

[tasks.test]
description = "Run the full test suite with coverage"
env = { RUST_BACKTRACE = "1" }
run = "deno test --unstable-http --unstable-webgpu --allow-all --parallel --coverage --trace-leaks"

[tasks."test:inspect"]
description = "Run the test suite with the inspector enabled"
env = { RUST_BACKTRACE = "1" }
run = "deno test --unstable-http --unstable-webgpu --allow-all --parallel --coverage --trace-leaks --inspect-wait"

[tasks."cov:gen"]
description = "Generate lcov report from the coverage data"
run = "deno coverage coverage --lcov --output=cov.lcov"

[tasks."build:wasm"]
description = "Build the wasm crates into each package's _wasm/"
run = "deno run --allow-read --allow-run _tools/build_wasm.ts"

[tasks."build:wasm:check"]
description = "Verify committed wasm matches the Rust sources"
depends = [{ task = "build:wasm", args = ["--check"] }]

[tasks.format]
description = "Format JS/TS and Rust code"
depends = ["format:wasm"]
run = "deno fmt"

[tasks."format:check"]
description = "Check JS/TS and Rust formatting"
depends = ["format:wasm:check"]
run = "deno fmt --check"

[tasks."format:wasm"]
description = "Format the Rust code"
dir = "_wasm"
run = "cargo fmt --all"

[tasks."format:wasm:check"]
description = "Check the Rust formatting"
dir = "_wasm"
run = "cargo fmt --all -- --check"

[tasks.fix]
description = "Format (JS + Rust) and auto-fix lint rules"
depends = ["format"]
run = "deno lint --fix"

[tasks.publish]
description = "Publish the workspace packages to JSR"
confirm = "Publish all workspace packages to JSR?"
run = "deno publish"

[tasks."publish:dry"]
description = "Check that the workspace packages can be published to JSR"
run = "deno publish --dry-run"

[tasks."publish:dry:dirty"]
description = "Check that the workspace packages can be published to JSR"
run = "deno publish --dry-run --allow-dirty"
